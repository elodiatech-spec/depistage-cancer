name: Sync index.html vers pole-sante

on:
  push:
    branches:
      - pole-sante
    paths:
      - 'index.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync index.html vers elodiatech-spec/pole-sante
        env:
          TOKEN: ${{ secrets.POLE_SANTE_TOKEN }}
        run: |
          python3 << 'EOF'
          import base64, json, os, urllib.request, urllib.error

          token = os.environ['TOKEN']
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
          }

          url = 'https://api.github.com/repos/elodiatech-spec/pole-sante/contents/index.html'

          with open('index.html', 'rb') as f:
              content = base64.b64encode(f.read()).decode('utf-8')

          sha = None
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
                  sha = data.get('sha')
          except urllib.error.HTTPError:
              pass

          payload = {
              'message': 'Sync automatique depuis depistage-cancer (branche pole-sante)',
              'content': content
          }
          if sha:
              payload['sha'] = sha

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers=headers,
              method='PUT'
          )
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())
              print(f"Fichier mis a jour: {result['content']['html_url']}")
          EOF
