name: Sync index.html vers pole-sante

on:
  push:
    branches:
      - pole-sante
    paths:
      - 'index.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout depistage-cancer
        uses: actions/checkout@v4

      - name: Cloner et mettre a jour pole-sante
        env:
          TOKEN: ${{ secrets.POLE_SANTE_TOKEN }}
        run: |
          git clone https://elodiatech-spec:${TOKEN}@github.com/elodiatech-spec/pole-sante.git /tmp/pole-sante
          cp index.html /tmp/pole-sante/index.html
          cd /tmp/pole-sante
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git diff --cached --quiet || git commit -m "Sync automatique depuis depistage-cancer"
          git push
